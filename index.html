<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lookz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div id="app">

        <!-- ГАРДЕРОБ -->
        <div id="screen-wardrobe" class="screen">
            <div class="screen-header">
                <h1 class="logo">Lookz</h1>
                <div id="header-drobi" class="drobi-avatar-header">
                    <img src="drobi_normal.png" alt="Дроби" class="drobi-img">
                </div>
            </div>
            <div id="drobi-tip-bubble" class="hidden"><p id="weather-text">Привет! ✨</p></div>
            
            <div class="categories-scroll">
                <button class="cat-btn active" data-cat="all">Всё</button>
                <button class="cat-btn" data-cat="outerwear">🧥 Верхняя</button>
                <button class="cat-btn" data-cat="top">👕 Верх</button>
                <button class="cat-btn" data-cat="bottom">👖 Низ</button>
                <button class="cat-btn" data-cat="shoes">👟 Обувь</button>
            </div>

            <div class="tags-scroll">
                <button class="tag-filter active" data-tag="all">Все стили</button>
                <button class="tag-filter" data-tag="Базовый">Базовый</button>
                <button class="tag-filter" data-tag="Casual">Casual</button>
                <button class="tag-filter" data-tag="Нарядный">Нарядный</button>
            </div>

            <div class="wardrobe-grid" id="wardrobe-grid"></div>
            <button class="fab" id="btn-add-item">+</button>
        </div>

        <!-- ДОБАВЛЕНИЕ ВЕЩИ -->
        <div id="screen-add-item" class="screen hidden">
            <div class="screen-header">
                <button class="btn-back" id="btn-back-add">←</button>
                <h2>Добавить вещь</h2>
                <div style="width: 40px;"></div>
            </div>
            
            <div class="add-item-container">
                <div id="add-step-photo">
                    <div class="photo-options">
                        <button class="photo-option" id="btn-camera">📸 Сделать фото</button>
                        <button class="photo-option" id="btn-gallery">🖼 Из галереи</button>
                    </div>
                    <input type="file" id="file-input" accept="image/*" hidden>
                    <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
                </div>

                <div id="add-step-processing" class="hidden">
                    <div class="processing-card">
                        <div style="width:100px; height:100px; margin: 0 auto 20px;">
                            <img src="drobi_think.png" class="drobi-mascot">
                        </div>
                        <p id="processing-text">Магия в процессе...</p>
                        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
                    </div>
                </div>

                <div id="add-step-result" class="hidden">
                    <div class="result-preview" style="width:200px; height:200px; margin:0 auto 20px;">
                        <img id="result-image" src="" style="width:100%; height:100%; object-fit:contain;">
                    </div>
                    
                    <div class="drobi-mini-right">
                        <div class="drobi-bubble-left" id="result-drobi-text">Супер!</div>
                        <div style="width:44px; height:44px; border-radius:50%; overflow:hidden;">
                            <img src="drobi_normal.png" style="width:100%; height:100%; object-fit:cover;">
                        </div>
                    </div>

                    <input type="text" id="item-name" class="input-field" placeholder="Название вещи">
                    
                    <p class="label">Категория:</p>
                    <div class="scrollable-buttons" id="category-buttons">
                        <button class="cat-select-btn" data-cat="outerwear">🧥 Верхняя</button>
                        <button class="cat-select-btn" data-cat="top">👕 Верх</button>
                        <button class="cat-select-btn" data-cat="bottom">👖 Низ</button>
                        <button class="cat-select-btn" data-cat="shoes">👟 Обувь</button>
                    </div>

                    <p class="label" style="margin-top:16px;">Стиль и Сезон:</p>
                    <div class="scrollable-buttons" id="tag-buttons">
                        <button class="tag-btn" data-tag="Базовый">Базовый</button>
                        <button class="tag-btn" data-tag="Casual">Casual</button>
                        <button class="tag-btn" data-tag="Нарядный">Нарядный</button>
                        <button class="tag-btn" data-tag="Оверсайз">Оверсайз</button>
                    </div>

                    <button class="btn-primary" id="btn-save-item" style="margin-top:24px;">Сохранить в шкаф</button>
                </div>
            </div>
        </div>

        <!-- ОСТАЛЬНЫЕ ЭКРАНЫ -->
        <div id="screen-item" class="screen hidden">
             <!-- ... (код карточки вещи) ... -->
        </div>

        <nav class="bottom-nav hidden" id="bottom-nav">
            <button class="nav-btn active" data-screen="wardrobe">
                <i class="ph ph-t-shirt nav-icon"></i>
                <span class="nav-label">Шкаф</span>
            </button>
            <button class="nav-btn" data-screen="looks">
                <i class="ph ph-sparkle nav-icon"></i>
                <span class="nav-label">Луки</span>
            </button>
            <button class="nav-btn" data-screen="profile">
                <i class="ph ph-user nav-icon"></i>
                <span class="nav-label">Я</span>
            </button>
        </nav>
    </div>

    <!-- МОДАЛКИ (Вставь их сюда) -->

    <script src="js/drobi.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/bgRemover.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/onboarding.js"></script>
    <script src="js/wardrobe.js"></script>
    <script src="js/addItem.js"></script>
    <script src="js/itemCard.js"></script>
    <script src="js/looks.js"></script>
    <script src="js/constructor.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/share.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
